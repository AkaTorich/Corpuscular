# Builds Corpuscular for Windows, macOS and Linux; a tag v* also publishes the builds as a GitHub release
name: Build

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            package: Corpuscular-Windows-x64.zip
          - name: macOS
            os: macos-14
            package: Corpuscular-macOS.zip
          - name: Linux
            os: ubuntu-22.04
            package: Corpuscular-Linux-x64.tar.gz
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "package/Corpuscular"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/CorpuscularApp_artefacts/Release/Corpuscular.exe $out
          Copy-Item -Recurse build/CorpuscularPlugin_artefacts/Release/VST3/Corpuscular.vst3 $out
          Copy-Item LICENSE, README.md $out
          Compress-Archive -Path $out -DestinationPath ${{ matrix.package }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          out=package/Corpuscular
          mkdir -p "$out"
          cp -R build/CorpuscularApp_artefacts/Release/Corpuscular.app "$out/"
          cp -R build/CorpuscularPlugin_artefacts/Release/VST3/Corpuscular.vst3 "$out/"
          cp -R build/CorpuscularPlugin_artefacts/Release/AU/Corpuscular.component "$out/"
          cp LICENSE README.md "$out/"
          (cd package && ditto -c -k --sequesterRsrc --keepParent Corpuscular "../${{ matrix.package }}")

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          out=package/Corpuscular
          mkdir -p "$out"
          cp build/CorpuscularApp_artefacts/Release/Corpuscular "$out/"
          cp -R build/CorpuscularPlugin_artefacts/Release/VST3/Corpuscular.vst3 "$out/"
          cp LICENSE README.md "$out/"
          tar -czf "${{ matrix.package }}" -C package Corpuscular

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" \
            --title "Corpuscular ${{ github.ref_name }}" --notes-file - <<'EOF'
          Builds of Corpuscular for Windows (VST3 + app), macOS (VST3, AU + app, universal) and Linux (VST3 + app).

          The builds are not signed. On macOS, after copying, allow them once:
          `xattr -dr com.apple.quarantine Corpuscular.app Corpuscular.vst3 Corpuscular.component`

          Corpuscular is free software under the GNU GPL v3; the source code is in this repository.
          EOF
